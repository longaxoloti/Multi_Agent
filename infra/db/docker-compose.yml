services:
  postgres:
    image: pgvector/pgvector:pg16-bookworm
    container_name: multi-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_ai
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
