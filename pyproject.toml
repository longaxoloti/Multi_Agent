[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent"
version = "0.1.0"
description = "A self-hosted, multi-model AI agent system."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name="longaxoloti", email="contact@example.com" }
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-text-splitters>=0.3.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "apache-airflow>=2.9.0",
    "google-genai>=1.0.0",
    "python-telegram-bot>=21.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "lxml>=5.0.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=4.0.0",
    "readability-lxml>=0.8.1",
    "markdownify>=0.11.0",
    "trafilatura>=2.0.0",
    "feedparser>=6.0.0",
    "nodriver>=0.38",
    "crawl4ai>=0.8.0",
    "mcp>=1.0.0",
    "alembic>=1.13.0",
    "typer>=0.12.0"
]

[project.scripts]
tesla = "main.cli:app"

[tool.hatch.build.targets.wheel]
packages = [
    "main",
    "storage",
    "memory",
    "graph",
    "telegram_bot",
    "tools",
    "pipelines",
    "rag"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bumpver]
current_version = "0.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
    'current_version = "{version}"',
]
"main/__init__.py" = [
    '__version__ = "{version}"',
]
